[project]
name = "mini-agent-harness"
version = "0.1.0"
description = "A minimal local agent harness with loop, memory, tools, and model client."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-openai>=1.1.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]
