[project]
name = "agentloop-harness"
version = "0.1.0"
description = "A minimal local agent harness with loop, memory, tools, and model client."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
openai-compatible = [
    "langchain-openai>=1.1.0",
]
openai = [
    "langchain-openai>=1.1.0",
]
anthropic = [
    "langchain-anthropic>=1.4.0",
]
gemini = [
    "langchain-google-genai>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[project.scripts]
agentloop = "agentloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that require external providers or credentials",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentloop"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
